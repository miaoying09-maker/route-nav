<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Route Assistant (List + OCR)</title>

<!-- OCR: Tesseract.js (front-end only) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e8e8ee;
    --blue:#1a73e8; --dark:#111; --muted:#666;
    --green:#1bbf5c; --red:#c62828;
  }
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial}
  .wrap{max-width:820px;margin:0 auto;padding:12px}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  h2{margin:8px 0 10px;font-size:26px}
  textarea{
    width:100%;height:150px;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);
    padding:12px;font-size:14px;line-height:1.35;background:#fff
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
  button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900}
  .primary{background:var(--blue);color:#fff}
  .ghost{background:#fff;border:1px solid var(--line);color:#111}
  .danger{background:#fff;border:1px solid #ffb3b3;color:var(--red)}
  .small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-weight:900}
  .lang{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .lang button{padding:8px 12px;font-size:14px;border-radius:999px}
  .lang .on{background:var(--blue);color:#fff;border:1px solid var(--blue)}
  .lang .off{background:#fff;color:#111;border:1px solid var(--line)}

  /* Sticky stats */
  .sticky{position:sticky; top:0; z-index:999;background:var(--bg); padding-top:8px;}
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;
    font-size:16px;font-weight:900;display:flex;gap:12px;flex-wrap:wrap;align-items:center
  }

  /* Sorting */
  .sortbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .sortbtn{background:#fff;border:1px solid var(--line);color:#111}
  .sortbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* Search */
  .search{
    width:100%;box-sizing:border-box;margin:8px 0 0;
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;background:#fff
  }

  /* List cards */
  .list{margin-top:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-top:10px;
  }
  .left{min-width:0;display:flex;gap:12px;align-items:flex-start}
  .no{
    background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;
    font-weight:1000;font-size:16px;line-height:1;flex:0 0 auto
  }
  .addr{font-size:15px;font-weight:900;line-height:1.25;word-break:break-word}
  .sub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
  .actions{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  .chk{width:22px;height:22px;transform:scale(1.15)}
  .navbtn{background:var(--blue);color:#fff;border-radius:14px;padding:12px 14px;font-weight:1000}
  .editbtn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:1000}
  .delivered{opacity:.45}

  /* OCR Progress */
  .progress{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;
    font-size:13px;color:#111;font-weight:800;
  }
  .bar{height:10px;background:#eee;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar > div{height:100%;width:0;background:var(--blue)}
</style>
</head>

<body>
<div class="wrap">
  <div class="topline">
    <h2 id="title">路线助手（纯列表最终版 + OCR）</h2>

    <!-- Language + Maps toggles -->
    <div class="lang">
      <span class="pill" id="langLabel">语言</span>
      <button id="btnZh" class="on">中文</button>
      <button id="btnEn" class="off">EN</button>

      <span class="pill" id="mapLabel">地图</span>
      <button id="btnMapApple" class="on">Apple</button>
      <button id="btnMapGoogle" class="off">Google</button>
    </div>
  </div>

  <textarea id="input"></textarea>

  <div class="row">
    <button class="primary" id="btnBuild"></button>
    <button class="ghost" id="btnOCR"></button>
    <button class="ghost" id="btnPaste"></button>
    <button class="ghost" id="btnCopyAll"></button>
    <button class="ghost" id="btnCopyAddr"></button>
    <button class="danger" id="btnClear"></button>
  </div>

  <div class="sticky">
    <div class="stat" id="stat"></div>

    <div class="sortbar">
      <button class="sortbtn" id="sortRaw"></button>
      <button class="sortbtn on" id="sortAsc"></button>
      <button class="sortbtn" id="sortDesc"></button>
    </div>

    <input class="search" id="search" />
    <div id="progress" class="progress" style="display:none">
      <div id="progText"></div>
      <div class="bar"><div id="progBar"></div></div>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="small" id="tips"></div>

  <!-- Multi-image input -->
  <input id="file" type="file" accept="image/*" multiple style="display:none" />
</div>

<script>
/* ===================== i18n: Chinese/English toggle ===================== */
const K_LANG = "rn2:lang";
let lang = localStorage.getItem(K_LANG) || "zh";

/* ===================== Maps: Apple/Google toggle ===================== */
const K_MAP = "rn2:map";
let mapMode = localStorage.getItem(K_MAP) || "apple"; // apple / google

const I18N = {
  zh: {
    title: "路线助手（纯列表最终版 + OCR）",

    ocrDone: n=>`OCR 完成 ✅ 提取到 ${n} 条（已去重并追加到输入框）\n\n如果有个别错的：点 ✏️ 手动改那一条就行。`,
    alertClipEmpty: "剪贴板为空",
    alertClipDenied: "无法读取剪贴板（请在 Safari 里允许粘贴权限）",

✅ 线路号每天不一样没关系：系统按“今天”独立保存（明天自动新的一天）。<br/>
✅ OCR 可能偶尔把号/地址识别错：点 ✏️ 只改这一条就行（会同步保存）。<br/>

Example:

Option 2: Click [Scan Screenshots] up to 9 images (recommended)
Auto-extracts Route No + Address`,

    alertClipDenied: "Cannot read clipboard (allow paste permission in Safari)",
    alertCopied: "Copied ✅",
    confirmClear: "Clear today's data?",
    promptNo: "Edit Route No (1–4 digits)",
    promptAddr: "Edit Address (include city/PA if possible)",
    errNo: "Route No must be 1–4 digits",
    max9: n=>`Max 9 images. You selected ${n}.`,
    tips: `✅ “Navigate” auto-marks delivered and opens the selected map app.<br/>
✅ Saved per day (tomorrow starts fresh).<br/>
✅ OCR can be wrong sometimes: tap ✏️ to edit just that item.<br/>

};

function applyMapUI(){
  document.getElementById('btnMapApple').className  = (mapMode==="apple")  ? "on" : "off";
  document.getElementById('btnMapGoogle').className = (mapMode==="google") ? "on" : "off";
}
document.getElementById('btnMapApple').onclick = ()=>{
  mapMode="apple"; localStorage.setItem(K_MAP,mapMode); applyMapUI();
};
document.getElementById('btnMapGoogle').onclick = ()=>{
  mapMode="google"; localStorage.setItem(K_MAP,mapMode); applyMapUI();
};

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = (lang==="zh") ? "zh" : "en";
  document.getElementById('title').textContent = t.title;
  document.getElementById('langLabel').textContent = t.langLabel;
  document.getElementById('mapLabel').textContent = t.mapLabel;

  elInput.placeholder = t.inputPH;

  document.getElementById('btnBuild').textContent = t.build;
  document.getElementById('btnOCR').textContent = t.ocr;
  document.getElementById('btnPaste').textContent = t.paste;
  document.getElementById('btnCopyAll').textContent = t.copyAll;
  document.getElementById('btnCopyAddr').textContent = t.copyAddr;
  document.getElementById('btnClear').textContent = t.clear;

  document.getElementById('sortRaw').textContent = t.sortRaw;
  document.getElementById('sortAsc').textContent = t.sortAsc;
  document.getElementById('sortDesc').textContent = t.sortDesc;

  elSearch.placeholder = t.searchPH;
  document.getElementById('tips').innerHTML = t.tips;

  document.getElementById('btnZh').className = (lang==="zh") ? "on" : "off";
  document.getElementById('btnEn').className = (lang==="en") ? "on" : "off";

  applyMapUI();
  renderAll();
}

document.getElementById('btnZh').onclick = ()=>{ lang="zh"; localStorage.setItem(K_LANG,lang); applyLang(); };
document.getElementById('btnEn').onclick = ()=>{ lang="en"; localStorage.setItem(K_LANG,lang); applyLang(); };

/* ===================== Storage: per day ===================== */
function todayKey(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const K_INPUT = "rn2:input:"+todayKey();
const K_DONE  = "rn2:done:"+todayKey();
const K_SORT  = "rn2:sort";
const K_FIX   = "rn2:fix:"+todayKey();

let doneSet = new Set(JSON.parse(localStorage.getItem(K_DONE) || "[]"));
let sortMode = localStorage.getItem(K_SORT) || "asc";
let fixedMap = JSON.parse(localStorage.getItem(K_FIX) || "{}");

/* ===================== Data ===================== */
let orders = []; // {id,noStr,noNum,addr,done}

/* ===================== DOM ===================== */
const elInput = document.getElementById('input');
const elList  = document.getElementById('list');
const elStat  = document.getElementById('stat');
const elSearch= document.getElementById('search');
const elFile  = document.getElementById('file');
const elProg  = document.getElementById('progress');
const elProgText = document.getElementById('progText');
const elProgBar  = document.getElementById('progBar');

document.getElementById('btnBuild').onclick = buildList;
document.getElementById('btnClear').onclick = clearToday;
document.getElementById('btnCopyAll').onclick = ()=>copyText(makeCopyText(true));
document.getElementById('btnCopyAddr').onclick = ()=>copyText(makeCopyText(false));
document.getElementById('btnOCR').onclick = ()=>elFile.click();
document.getElementById('btnPaste').onclick = pasteFromClipboard;

document.getElementById('sortRaw').onclick  = ()=>setSort("raw");
document.getElementById('sortAsc').onclick  = ()=>setSort("asc");
document.getElementById('sortDesc').onclick = ()=>setSort("desc");

elSearch.addEventListener('input', renderList);

elFile.addEventListener('change', async ()=>{
  const files = Array.from(elFile.files || []);
  elFile.value = "";
  if(!files.length) return;

  if(files.length > 9){
    alert(I18N[lang].max9(files.length));
    return;
  }
  await runOCR(files);
});

/* ===================== Restore input ===================== */
elInput.value = localStorage.getItem(K_INPUT) || "";
elInput.addEventListener('input', ()=> localStorage.setItem(K_INPUT, elInput.value));

/* ===================== Clipboard ===================== */
async function pasteFromClipboard(){
  try{
    const txt = await navigator.clipboard.readText();
    if(!txt) return alert(I18N[lang].alertClipEmpty);
    elInput.value = (elInput.value ? (elInput.value.trimEnd()+"\n") : "") + txt.trim();
    localStorage.setItem(K_INPUT, elInput.value);
    buildList();
  }catch(e){
    alert(I18N[lang].alertClipDenied);
  }
}

/* ===================== Parse: each line "no addr" ===================== */
function parseLines(text){
  const lines = (text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const line of lines){
    const m = line.match(/^(?:NO\.?\s*)?(\d{1,4})[,\s，]+(.+)$/i);
    if(m){
      out.push({noStr:m[1], noNum:parseInt(m[1],10), addr:m[2].trim()});
    }
  }
  return out;
}

/* ===================== Sorting ===================== */
function setSort(mode){
  sortMode = mode;
  localStorage.setItem(K_SORT, sortMode);
  document.getElementById('sortRaw').classList.toggle('on', sortMode==="raw");
  document.getElementById('sortAsc').classList.toggle('on', sortMode==="asc");
  document.getElementById('sortDesc').classList.toggle('on', sortMode==="desc");
  renderAll();
}
function sortOrders(arr){
  const a = arr.slice();
  if(sortMode==="raw") return a;
  a.sort((x,y)=> sortMode==="asc" ? (x.noNum-y.noNum) : (y.noNum-x.noNum));
  return a;
}

/* ===================== Build list ===================== */
function buildList(){
  const parsed = parseLines(elInput.value || "");

  orders = parsed.map(p=>{
    const id = p.noStr + "||" + p.addr; // base key
    const fix = fixedMap[id];
    const noStr = fix?.noStr || p.noStr;
    const addr  = fix?.addr  || p.addr;
    const noNum = parseInt(noStr,10);

    return {
      id,
      noStr,
      noNum: Number.isFinite(noNum) ? noNum : 999999,
      addr,
      done: doneSet.has(id),
    };
  });

  // de-dup by current no+addr (prevents duplicates after edits)
  const seen = new Set();
  orders = orders.filter(o=>{
    const k = o.noStr + "||" + o.addr;
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });

  saveDone();
  renderAll();
}

/* ===================== Stats ===================== */
function renderStat(){
  const total = orders.length;
  const sent = orders.filter(o=>o.done).length;
  elStat.textContent = I18N[lang].stat(total, sent, total - sent);
}

/* ===================== Render list ===================== */
function renderList(){
  elList.innerHTML = "";
  const q = (elSearch.value || "").trim().toLowerCase();

  let view = sortOrders(orders);
  if(q){
    view = view.filter(o => (`${o.noStr} ${o.addr}`).toLowerCase().includes(q));
  }

  view.forEach(o=>{
    const card = document.createElement('div');
    card.className = "card" + (o.done ? " delivered" : "");
    card.innerHTML = `
      <div class="left">
        <div class="no">NO.${escapeHtml(o.noStr)}</div>
        <div style="min-width:0">
          <div class="addr">${escapeHtml(o.addr)}</div>
          <div class="sub">${escapeHtml(I18N[lang].sub)}</div>
        </div>
      </div>
      <div class="actions">
        <button class="editbtn" title="${escapeHtml(I18N[lang].editTitle)}">✏️</button>
        <input class="chk" type="checkbox" ${o.done?"checked":""} />
        <button class="navbtn">${escapeHtml(I18N[lang].nav)}</button>
      </div>
    `;

    // manual check
    card.querySelector('.chk').addEventListener('change', (e)=>{
      o.done = e.target.checked;
      if(o.done) doneSet.add(o.id);
      else doneSet.delete(o.id);
      saveDone();
      renderAll();
    });

    // navigation
    card.querySelector('.navbtn').addEventListener('click', ()=> startNav(o));

    // edit
    card.querySelector('.editbtn').addEventListener('click', ()=>{
      const newNo = prompt(I18N[lang].promptNo, o.noStr);
      if(newNo===null) return;
      const noClean = String(newNo).trim().replace(/^NO\.?/i,'').trim();
      if(!/^\d{1,4}$/.test(noClean)){
        alert(I18N[lang].errNo);
        return;
      }
      const newAddr = prompt(I18N[lang].promptAddr, o.addr);
      if(newAddr===null) return;

      // store edits (keyed by original id)
      fixedMap[o.id] = {noStr:noClean, addr:String(newAddr).trim()};
      localStorage.setItem(K_FIX, JSON.stringify(fixedMap));

      // apply in-memory
      o.noStr = noClean;
      o.noNum = parseInt(noClean,10);
      o.addr  = String(newAddr).trim();
      renderAll();
    });

    elList.appendChild(card);
  });

  renderStat();
}
function renderAll(){
  renderStat();
  renderList();
}

/* ===================== Done storage ===================== */
function saveDone(){
  localStorage.setItem(K_DONE, JSON.stringify([...doneSet]));
}

/* ===================== Navigation: Apple Maps / Google Maps (auto mark done) ===================== */
function startNav(o){
  if(!o.done){
    o.done = true;
    doneSet.add(o.id);
    saveDone();
    renderAll();
  }

  let url = "";
  if(mapMode === "apple"){
    // iOS-friendly: opens Apple Maps app when possible
    url = "https://maps.apple.com/?daddr=" + encodeURIComponent(o.addr) + "&dirflg=d";
  }else{
    url = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(o.addr) + "&travelmode=driving";
  }
  window.location.href = url;
}

/* ===================== Copy ===================== */
function makeCopyText(withNo){
  const view = sortOrders(orders);
  if(withNo) return view.map(o=>`${o.noStr} ${o.addr}`).join("\n");
  return view.map(o=>o.addr).join("\n");
}
async function copyText(txt){
  try{
    await navigator.clipboard.writeText(txt);
    alert(I18N[lang].alertCopied);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert(I18N[lang].alertCopied);
  }
}

/* ===================== Clear today ===================== */
function clearToday(){
  if(!confirm(I18N[lang].confirmClear)) return;
  localStorage.removeItem(K_INPUT);
  localStorage.removeItem(K_DONE);
  localStorage.removeItem(K_FIX);
  doneSet = new Set();
  fixedMap = {};
  orders = [];
  elInput.value = "";
  renderAll();
}

/* ===================== OCR 강화: overlapped slices + digit whitelist + append & dedupe ===================== */
function showProgress(on){
  elProg.style.display = on ? "block" : "none";
  if(!on){ elProgText.textContent=""; elProgBar.style.width="0%"; }
}
function setProgress(text, pct){
  elProgText.textContent = text;
  elProgBar.style.width = Math.max(0, Math.min(100, pct||0)) + "%";
}

function fileToImage(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

async function sliceImageOverlap(file, parts=4, overlapRatio=0.12){
  const img = await fileToImage(file);
  const w = img.naturalWidth, h = img.naturalHeight;
  const canvases = [];
  const partH = h / parts;
  const overlap = Math.floor(partH * overlapRatio);

  for(let i=0;i<parts;i++){
    let y0 = Math.floor(i * partH) - (i===0 ? 0 : overlap);
    let y1 = Math.floor((i+1) * partH) + (i===parts-1 ? 0 : overlap);
    y0 = Math.max(0, y0);
    y1 = Math.min(h, y1);
    const ch = Math.max(1, y1 - y0);

    const c = document.createElement('canvas');
    c.width = w;
    c.height = ch;
    c.getContext('2d').drawImage(img, 0, y0, w, ch, 0, 0, w, ch);
    canvases.push(c);
  }
  return canvases;
}

function cropLeft(canvas, ratio=0.40){
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(canvas.width * ratio));
  c.height = canvas.height;
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}

async function ocrCanvas(canvas, onProgress){
  const { data } = await Tesseract.recognize(
    canvas,
    "eng",
    {
      logger: m=>{
        if(m.status==="recognizing text" && onProgress){
          onProgress(m.progress || 0);
        }
      }
    }
  );
  return (data && data.text) ? data.text : "";
}

async function ocrDigits(canvas, onProgress){
  const { data } = await Tesseract.recognize(
    canvas,
    "eng",
    {
      logger: m=>{
        if(m.status==="recognizing text" && onProgress){
          onProgress(m.progress || 0);
        }
      },
      tessedit_char_whitelist: "0123456789"
    }
  );
  return (data && data.text) ? data.text : "";
}

function normalizeText(s){
  return String(s||"")
    .replace(/\r/g,"\n")
    .replace(/[|•·]+/g," ")
    .replace(/[，]/g,",")
    .replace(/\s+\n/g,"\n")
    .replace(/\n\s+/g,"\n")
    .replace(/[ \t]{2,}/g," ")
    .trim();
}

function extractAddress(t){
  const suffix = "(St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Blvd|Boulevard|Ln|Lane|Ct|Court|Pl|Place|Way|Pike|Cir|Circle|Ter|Terrace|Hwy|Highway)";
  const re1 = new RegExp(
    "(\\d{1,5}\\s+[A-Za-z0-9.'-]+(?:\\s+[A-Za-z0-9.'-]+){0,6}\\s+"+suffix+
    "\\b[^\\n]{0,90}?(?:,\\s*[A-Za-z .'-]+,\\s*PA\\b|\\bPA\\b(?:\\s*\\d{5})?))",
    "i"
  );
  const m1 = t.match(re1);
  if(m1) return cleanAddr(m1[1]);

  const re2 = new RegExp("(\\d{1,5}\\s+[A-Za-z0-9.'-]+(?:\\s+[A-Za-z0-9.'-]+){0,8}\\s+"+suffix+"\\b[^\\n]{0,80})","i");
  const m2 = t.match(re2);
  if(m2) return cleanAddr(m2[1]);

  return null;
}

function cleanAddr(a){
  return String(a)
    .replace(/\s*,\s*/g,", ")
    .replace(/\s{2,}/g," ")
    .replace(/\s*\.\.\.\s*$/,"")
    .trim();
}

function extractRouteNo(textDigits, textAll, addr){
  const addrNum = (addr.match(/\b(\d{1,5})\b/)||[])[1] || "";
  const dig = normalizeText(textDigits).replace(/\D/g," ").trim().split(/\s+/).filter(Boolean);

  const digCandidates = dig
    .map(x=>x.trim())
    .filter(x=>/^\d{1,4}$/.test(x))
    .filter(x=>!(addrNum && x===addrNum));

  if(digCandidates.length){
    digCandidates.sort((a,b)=>{
      if(a.length!==b.length) return a.length-b.length;
      return parseInt(a,10)-parseInt(b,10);
    });
    return digCandidates[0];
  }

  const t = normalizeText(textAll);
  const near = t.match(/(?:route\s*no|route|rte|no\.?)\s*[:#]?\s*(\d{1,4})/i);
  if(near && (!addrNum || near[1]!==addrNum)) return near[1];

  const lines = t.split("\n").map(s=>s.trim()).filter(Boolean);
  const candidates = [];
  for(const line of lines){
    if(/\b20\d{2}\b/.test(line)) continue;
    if(/\b\d+\.\d+\b/.test(line)) continue;
    if(/\b\d{5}\b/.test(line) && line.length<=8) continue;

    const m = line.match(/^(\d{1,4})$/);
    if(m){
      const n = m[1];
      if(addrNum && n===addrNum) continue;
      let score = 100;
      if(n.length===4) score -= 15;
      candidates.push({n, score});
      continue;
    }
    const m2 = line.match(/^(\d{1,4})\b/);
    if(m2){
      const n = m2[1];
      if(addrNum && n===addrNum) continue;
      let score = 60;
      if(/\b(St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Blvd|Lane|Ln|Ct|Pl|Way|Pike)\b/i.test(line)) score -= 25;
      if(n.length===4) score -= 15;
      candidates.push({n, score});
    }
  }
  if(!candidates.length) return null;
  candidates.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    if(a.n.length!==b.n.length) return a.n.length-b.n.length;
    return parseInt(a.n,10)-parseInt(b.n,10);
  });
  return candidates[0].n;
}

function extractPair(textDigits, textAll){
  const all = normalizeText(textAll);
  const addr = extractAddress(all);
  if(!addr) return null;

  const no = extractRouteNo(textDigits, all, addr);
  if(!no) return null;

  return {noStr:no, addr};
}

async function runOCR(files){
  showProgress(true);
  setProgress(I18N[lang].ocrReady, 1);

  const results = [];
  let done = 0;
  const totalSlices = files.length * 4;

  for(let i=0;i<files.length;i++){
    setProgress(I18N[lang].ocrSlicing(i+1, files.length), Math.floor(done/totalSlices*100));
    const slices = await sliceImageOverlap(files[i], 4, 0.12);

    for(let s=0;s<slices.length;s++){
      const label = I18N[lang].ocrRunning(i+1, files.length, s+1);
      let lastP = 0;

      const left = cropLeft(slices[s], 0.40);

      const digitsText = await ocrDigits(left, (p)=>{
        const pct = Math.floor(((done + p*0.45) / totalSlices) * 100);
        if(p > lastP + 0.06){ setProgress(label, pct); lastP = p; }
      });

      const fullText = await ocrCanvas(slices[s], (p)=>{
        const pct = Math.floor(((done + 0.45 + p*0.55) / totalSlices) * 100);
        if(p > lastP + 0.06){ setProgress(label, pct); lastP = p; }
      });

      done++;

      const pair = extractPair(digitsText, fullText);
      if(pair) results.push(pair);
    }
  }

  showProgress(false);

  // De-dup OCR results by no+addr
  const uniq = [];
  const seen = new Set();
  for(const r of results){
    const key = r.noStr + "||" + r.addr;
    if(seen.has(key)) continue;
    seen.add(key);
    uniq.push(r);
  }

  if(!uniq.length){
    alert(I18N[lang].ocrNone);
    return;
  }

  // Append OCR lines to existing input, then re-parse & de-dup
  const appendText = uniq.map(x=>`${x.noStr} ${x.addr}`).join("\n");
  const merged = (elInput.value ? (elInput.value.trimEnd()+"\n") : "") + appendText;

  const parsed = parseLines(merged);
  const seen2 = new Set();
  const finalLines = [];
  for(const p of parsed){
    const k = p.noStr + "||" + p.addr;
    if(seen2.has(k)) continue;
    seen2.add(k);
    finalLines.push(`${p.noStr} ${p.addr}`);
  }

  elInput.value = finalLines.join("\n");
  localStorage.setItem(K_INPUT, elInput.value);

  // Default sort asc
  setSort("asc");
  buildList();

  alert(I18N[lang].ocrDone(uniq.length));
}

/* ===================== Safe output ===================== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

(function init(){
  document.getElementById('sortRaw').classList.toggle('on', sortMode==="raw");
  document.getElementById('sortAsc').classList.toggle('on', sortMode==="asc");
  document.getElementById('sortDesc').classList.toggle('on', sortMode==="desc");

  applyLang();     // sets UI text + stats
  applyMapUI();    // sets map buttons
  buildList();     // renders list
})();
